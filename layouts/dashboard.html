<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManosTech – Dashboard</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🚀</div>
      <div>
        <div class="logo-text">ManosTech</div>
        <div class="logo-sub">Platform v2.0</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Principal</div>
      <ul>
        <li class="nav-item"><a href="#" class="nav-link" data-module="dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="eventos"><span class="nav-icon">🎉</span> Eventos</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="empresas"><span class="nav-icon">🏢</span> Empresas</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="visitantes"><span class="nav-icon">👥</span> Visitantes</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="campanhas"><span class="nav-icon">📢</span> Campanhas</a></li>
      </ul>
      <div class="sidebar-section-label">Gestão</div>
      <ul>
        <li class="nav-item"><a href="#" class="nav-link" data-module="relatorios"><span class="nav-icon">📈</span> Relatórios</a></li>
        <li class="nav-item nav-admin-only"><a href="#" class="nav-link" data-module="financeiro"><span class="nav-icon">💰</span> Financeiro</a></li>
        <li class="nav-item nav-admin-only"><a href="#" class="nav-link" data-module="usuarios"><span class="nav-icon">👤</span> Usuários</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="unidades"><span class="nav-icon">🏬</span> Unidades</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="funcionarios"><span class="nav-icon">👷</span> Funcionários</a></li>
      </ul>
      <div class="sidebar-section-label">Configurar</div>
      <ul>
        <li class="nav-item"><a href="#" class="nav-link" data-module="configuracoes"><span class="nav-icon">⚙️</span> Configurações</a></li>
        <li class="nav-item"><a href="#" class="nav-link" data-module="perfil"><span class="nav-icon">🙋</span> Perfil</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebarUserName">-</div>
          <div class="user-role" id="sidebarUserRole">-</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-subtitle" id="topbarSubtitle">Visão geral</div>
      </div>
    </div>
    <div class="topbar-right">
      <a href="portal.html" target="_blank" class="topbar-btn" title="Portal Captivo">🌐</a>
      <button class="topbar-btn" title="Notificações">🔔</button>
      <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Sair →</button>
    </div>
  </header>

  <!-- Content -->
  <main class="main-content" id="mainContent">
    <div class="page-loading"><div class="spinner"></div> Carregando...</div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="globalModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Título</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
