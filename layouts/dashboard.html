<script type="module">
  import { auth } from '../js/core/auth.js';
  import { session } from '../js/core/session.js';

  // Atualizar email do usuário
  const user = session.getUser() || auth.getUser();
  if (user) {
    document.getElementById('userEmail').textContent = user.email || 'Usuário';
  }

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await auth.logout();
    window.location.hash = '#/login';
  });

  // Destacar link ativo na sidebar
  function highlightActiveLink() {
    const currentPath = window.location.hash.slice(1) || '/dashboard';
    document.querySelectorAll('.nav-link').forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href').slice(1) === currentPath) {
        link.classList.add('active');
      }
    });
  }

  // Ouvir mudanças de hash para atualizar sidebar (apenas highlight, sem navegar)
  window.addEventListener('hashchange', highlightActiveLink);

  // Executar imediatamente para marcar o link atual
  highlightActiveLink();
</script>
