<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ManosTech Platform</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-container">
      <h1 style="text-align: center; color: var(--primary-color); margin-bottom: var(--spacing-xl);">ManosTech</h1>
      
      <form id="loginForm">
        <div class="form-group required">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu@email.com" 
            required
          >
        </div>

        <div class="form-group required">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Digite sua senha" 
            required
          >
        </div>

        <div class="form-check">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Lembrar-me</label>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--spacing-lg);">
          Entrar
        </button>
      </form>

      <p style="text-align: center; margin-top: var(--spacing-lg); color: var(--text-light);">
        Não tem uma conta? <a href="#/signup">Cadastre-se aqui</a>
      </p>
    </div>
  </div>

  <script type="module" src="../js/layouts/auth-init.js"></script>
</body>
</html>
