<div class="auth-container">
  <div class="auth-form">
    <h2>🔐 Login</h2>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="seu@email.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-full">
        Entrar
      </button>

      <p style="text-align: center; margin-top: var(--spacing-lg); font-size: var(--font-size-sm);">
        Não tem conta? <a href="#/register">Registre-se aqui</a>
      </p>
    </form>

    <div id="errorMessage" style="display: none; margin-top: var(--spacing-lg);">
      <!-- Mensagem de erro aqui -->
    </div>
  </div>
</div>

<script type="module">
  import { auth } from '../js/core/auth.js';
  import { session } from '../js/core/session.js';

  const loginForm = document.getElementById('loginForm');
  const errorMessage = document.getElementById('errorMessage');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      console.log('Tentando fazer login com:', email);
      
      const result = await auth.login(email, password);
      
      if (result.success) {
        console.log('✅ Login realizado com sucesso!');
        
        // Inicializar sessão
        await session.initialize();
        
        // Redirecionar para dashboard
        window.location.hash = '#/dashboard';
      } else {
        console.error('❌ Erro ao fazer login:', result.message);
        errorMessage.style.display = 'block';
        errorMessage.innerHTML = `
          <div style="background-color: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: var(--spacing-md); border-radius: var(--radius-md);">
            ${result.message || 'Erro ao fazer login. Verifique suas credenciais.'}
          </div>
        `;
      }
    } catch (error) {
      console.error('Erro:', error);
      errorMessage.style.display = 'block';
      errorMessage.innerHTML = `
        <div style="background-color: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: var(--spacing-md); border-radius: var(--radius-md);">
          ${error.message || 'Erro ao fazer login'}
        </div>
      `;
    }
  });
</script>
