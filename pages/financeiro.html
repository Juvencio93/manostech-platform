<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro - ManosTech Platform</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <nav class="sidebar">
      <div class="logo">ManosTech</div>
      <ul class="menu">
        <li><a href="#/dashboard">Dashboard</a></li>
        <li><a href="#/eventos">Eventos</a></li>
        <li><a href="#/lojas">Lojas</a></li>
        <li><a href="#/visitantes">Visitantes</a></li>
        <li><a href="#/marketing">Marketing</a></li>
        <li><a href="#/funcionarios">Funcionários</a></li>
        <li><a href="#/financeiro" class="active">Financeiro</a></li>
        <li><a href="#/relatorios">Relatórios</a></li>
        <li><a href="#/configuracoes">Configurações</a></li>
      </ul>
    </nav>
    <main class="content">
      <header class="top-bar">
        <h2>Financeiro</h2>
        <button id="novaTransacaoBtn" class="btn btn-primary">+ Nova Transação</button>
      </header>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Receita Total</h3>
          <p id="totalReceita">R$ 0,00</p>
        </div>
        <div class="stat-card">
          <h3>Despesa Total</h3>
          <p id="totalDespesa">R$ 0,00</p>
        </div>
        <div class="stat-card">
          <h3>Saldo</h3>
          <p id="saldoTotal">R$ 0,00</p>
        </div>
      </div>
      <div class="table-container">
        <table id="transacoesTable">
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Data</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="transacoesBody">
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script type="module" src="../js/pages/financeiro.js"></script>
</body>
</html>
