<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>ManosTech Platform</title>\n  \n  <!-- CSS -->\n  <link rel=\"stylesheet\" href=\"./assets/css/app.css\">\n  <style>\n    html, body {\n      margin: 0;\n      padding: 0;\n      height: 100%;\n      background-color: var(--light-bg);\n    }\n  </style>\n</head>\n<body>\n  <div id=\"app\">\n    <!-- Layout será carregado aqui -->\n  </div>\n\n  <!-- Scripts -->\n  <script type=\"module\">\n    import { router } from './js/core/router.js';\n    import { auth } from './js/core/auth.js';\n    import { session } from './js/core/session.js';\n\n    async function initializeApp() {\n      try {\n        console.log('🚀 Iniciando ManosTech Platform...');\n        \n        // Verificar autenticação\n        const isAuthenticated = auth.checkAuth();\n        console.log('Autenticado?', isAuthenticated);\n        \n        if (!isAuthenticated) {\n          console.log('Redirecionando para login...');\n          window.location.hash = '#/login';\n          return;\n        }\n\n        // Inicializar sessão\n        await session.initialize();\n        console.log('✅ Sessão inicializada');\n\n        // Inicializar roteador\n        router.initialize();\n        console.log('✅ Roteador inicializado');\n\n        // Navegar para dashboard\n        if (window.location.hash === '' || window.location.hash === '#') {\n          window.location.hash = '#/dashboard';\n        }\n      } catch (error) {\n        console.error('❌ Erro ao inicializar:', error);\n        document.getElementById('app').innerHTML = `\n          <div style=\"padding: 20px; color: red;\">\n            <h2>Erro ao inicializar aplicação</h2>\n            <p>${error.message}</p>\n            <button onclick=\"location.reload()\">Recarregar</button>\n          </div>\n        `;\n      }\n    }\n\n    // Iniciar quando pronto\n    if (document.readyState === 'loading') {\n      document.addEventListener('DOMContentLoaded', initializeApp);\n    } else {\n      initializeApp();\n    }\n  </script>\n</body>\n</html>
